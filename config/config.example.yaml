switch:
  # Example only. Enter the actual switch VLAN IP.
  # The switch VLAN IP must be within 192.168.39.0/24.
  host: 192.168.39.10
  username: SWITCH_USERNAME
  password: SWITCH_PASSWORD

watcher:
  poll_interval_seconds: 10
  rearm_down_seconds: 60

network:
  vlan: 1
  temporary_prefix_length: 24

lanes:
  # Example port only.
  - name: fusion-25g-reset
    enabled: true
    port: "1/1"
    expected_speed: "25G"
    device_family: "fusion"
    workflow: "factory_reset"

  # Example port only.
  - name: fusion-10g-reset
    enabled: true
    port: "1/3"
    expected_speed: "10G"
    device_family: "fusion"
    workflow: "factory_reset"

  # Example port only.
  - name: muon-a10-reset
    enabled: true
    port: "1/5"
    expected_speed: "10G"
    device_family: "muon-a10"
    workflow: "factory_reset"
